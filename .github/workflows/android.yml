name: Android

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  EMULATOR_IMAGE: system-images;android-23;google_apis;armeabi-v7a
  BUILD_TOOLS_VERSION: 23.0.3
  EMULATOR_NAME: 2.7_QVGA_API_23
  ANDROID_NDK_VERSION: 27.3.13750724

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: 8512546

    - name: Fallback emulator
      run: |
        wget "https://edgedl.me.gvt1.com/edgedl/android/repository/emulator-linux_x64-9529220.zip" -O emulator-linux_x64-9529220.zip
        unzip -o emulator-linux_x64-9529220.zip -d $ANDROID_HOME
        rm emulator-linux_x64-9529220.zip

    - name: Install SDK packages
      run: sdkmanager "platform-tools" "build-tools;$BUILD_TOOLS_VERSION" "emulator" "$EMULATOR_IMAGE"

    - name: Setup target
      run: rustup target add armv7-linux-androideabi

    - name: Create AVD
      run: |
        echo no | avdmanager create avd --force --name $EMULATOR_NAME --abi armeabi-v7a --package $EMULATOR_IMAGE
        mkdir -p ~/.android/avd/$EMULATOR_NAME.avd/ && cp ./android/avd/$EMULATOR_NAME.avd/config.ini ~/.android/avd/$EMULATOR_NAME.avd/config.ini
        echo "avd.ini.encoding=UTF-8
        path=$HOME/.android/avd/$EMULATOR_NAME.avd
        path.rel=avd/$EMULATOR_NAME.avd
        target=android-23" >> $HOME/.android/avd/$EMULATOR_NAME.ini

    - name: Run emulator
      run: $ANDROID_HOME/emulator/emulator -avd $EMULATOR_NAME -no-window -no-audio -no-boot-anim -gpu off -netdelay none -netspeed full &

    - name: Build
      run: PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin cargo build --verbose --target armv7-linux-androideabi

    - name: Wait for emulator
      run: timeout 300 bash -c -- 'adb wait-for-device shell "while [[ -z $(getprop dev.bootcomplete) ]]; do sleep 1; done;"'

    - name: Run tests
      run: PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin cargo test --verbose --target armv7-linux-androideabi
